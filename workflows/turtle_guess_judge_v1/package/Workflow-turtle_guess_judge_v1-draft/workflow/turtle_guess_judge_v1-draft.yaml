- id: '300001'
  type: code
  title: 校验判定结果
  icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
  description: 拒绝非法模型输出并返回稳定 JSON
  version: v2
  position:
    x: 1320
    y: 120
  parameters:
    code: "import json\nimport re\n\nasync def main(args: Args) -> Output:\n    raw\
      \ = str(args.params.get(\"raw\") or \"\").strip()\n    raw = re.sub(r\"^```(?:json)?\\\
      s*|\\s*```$\", \"\", raw, flags=re.I | re.S).strip()\n    try:\n        data\
      \ = json.loads(raw)\n    except Exception:\n        return {\"result\": \"\"\
      }\n    valid = isinstance(data.get('is_solved'), bool) and isinstance(data.get('summary'),\
      \ str)\n    keys = data.get(\"matched_point_keys\")\n    if not valid or not\
      \ isinstance(keys, list) or not all(isinstance(key, str) for key in keys):\n\
      \        return {\"result\": \"\"}\n    data[\"safety_note\"] = str(data.get(\"\
      safety_note\") or \"\")\n    return {\"result\": json.dumps(data, ensure_ascii=False,\
      \ separators=(\",\", \":\"))}"
    language: 3
    node_inputs:
    - name: raw
      input:
        value:
          path: output
          ref_node: '200001'
    node_outputs:
      result:
        type: string
        value: null
    settingOnError:
      processType: 1
      retryTimes: 0
      switch: false
      timeoutMs: 60000
