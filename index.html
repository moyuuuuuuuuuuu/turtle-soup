<!doctype html>
<html>
  <head>
    <title>墨鱼海龟汤 · 后台管理</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="墨鱼海龟汤内容与运营管理后台"
    />
    <link id="app-favicon" rel="icon" type="image/png" href="/brand/favicon-light.png" />

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
          const syncFavicon = () => {
            const favicon = document.getElementById('app-favicon')
            if (favicon) {
              favicon.href = document.documentElement.classList.contains('dark')
                ? '/brand/favicon-dark.png'
                : '/brand/favicon-light.png'
            }
          }
          syncFavicon()
          new MutationObserver(syncFavicon).observe(document.documentElement, {
            attributes: true,
            attributeFilter: ['class']
          })
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
