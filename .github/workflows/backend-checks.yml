name: Backend checks

on:
  push:
    branches: [system-manage]
  pull_request:
    branches: [system-manage]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer check
