name: Admin frontend checks

on:
  push:
    branches: [system-manage-ui]
  pull_request:
    branches: [system-manage-ui]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --registry=https://registry.npmjs.org audit --prod
      - run: pnpm lint
      - run: pnpm build
